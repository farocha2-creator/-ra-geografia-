<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RA Geografia - Exemplo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    .instrucoes {
      position: fixed; top: 10px; left: 0; width: 100%;
      text-align: center; z-index: 999; font-family: sans-serif;
      color: #fff; text-shadow: 0 0 4px #000; pointer-events: none;
    }
  </style>
</head>
<body style="margin:0; overflow:hidden;">

  <div class="instrucoes" id="instrucoes">
    Aponte a câmera para o marcador <b>Hiro</b> abaixo (clique com o botão direito &gt; salvar imagem, ou tire print, para imprimir):
    <br>
    <img src="hiro.png" alt="Marcador Hiro" style="max-width:200px; margin-top:6px; border:2px solid #fff;">
    <br>
    <button onclick="document.getElementById('instrucoes').style.display='none'"
      style="margin-top:8px; padding:6px 14px; border-radius:6px; border:none; background:#fff; color:#000; font-weight:bold; pointer-events:auto;">
      Já salvei o marcador — esconder
    </button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marcador Hiro: camadas da Terra -->
    <a-marker preset="hiro">

      <!-- Corte das camadas da Terra (núcleo interno, núcleo externo, manto, crosta), com textura e proporções reais -->
      <a-entity
        scale="1.2 1.2 1.2"
        position="0 0.3 0"
        rotation="0 -45 0">

        <a-entity gltf-model="earth_cutaway.glb"></a-entity>

        <!-- Seta + rótulo: Crosta -->
        <a-entity line="start: 0 0 0.975; end: 0.4 0.9 0.975; color: #111"></a-entity>
        <a-text value="Crosta" position="0.45 0.95 0.975" align="left" color="#111" width="1.1"></a-text>

        <!-- Seta + rótulo: Manto -->
        <a-entity line="start: 0 0 0.75; end: 0.5 0.45 0.75; color: #111"></a-entity>
        <a-text value="Manto" position="0.55 0.5 0.75" align="left" color="#111" width="1.1"></a-text>

        <!-- Seta + rótulo: Núcleo externo -->
        <a-entity line="start: 0 0 0.375; end: 0.6 0 0.375; color: #111"></a-entity>
        <a-text value="Nucleo externo" position="0.65 0.05 0.375" align="left" color="#111" width="1.1"></a-text>

        <!-- Seta + rótulo: Núcleo interno -->
        <a-entity line="start: 0 0 0.10; end: 0.7 -0.5 0.10; color: #111"></a-entity>
        <a-text value="Nucleo interno" position="0.75 -0.55 0.10" align="left" color="#111" width="1.1"></a-text>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
