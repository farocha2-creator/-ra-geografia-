<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RA Geografia - Exemplo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    .instrucoes {
      position: fixed; top: 10px; left: 0; width: 100%;
      text-align: center; z-index: 999; font-family: sans-serif;
      color: #fff; text-shadow: 0 0 4px #000; pointer-events: none;
    }
  </style>
</head>
<body style="margin:0; overflow:hidden;">

  <div class="instrucoes">
    Aponte a câmera para o marcador <b>Hiro</b> (baixe/imprima em:
    <a href="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png" style="color:#9cf;" target="_blank">link do marcador</a>)
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marcador de teste (Hiro). Em produção, cada face do cubo usaria um marcador/padrão diferente -->
    <a-marker preset="hiro">

      <!-- "Globo" simples representando a Terra -->
      <a-sphere position="0 0.6 0" radius="0.4" color="#2E86AB"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-sphere>

      <!-- Bloco representando um "relevo" (poderia ser substituído por um DEM exportado do QGIS) -->
      <a-box position="0 0.05 0" width="1" height="0.1" depth="1" color="#6B8E23"></a-box>
      <a-cone position="-0.25 0.25 0.2" radius-bottom="0.15" radius-top="0" height="0.35" color="#8B5E3C"></a-cone>
      <a-cone position="0.2 0.2 -0.15" radius-bottom="0.12" radius-top="0" height="0.25" color="#8B5E3C"></a-cone>

      <!-- Rótulo -->
      <a-text value="Geografia em RA" position="0 1.1 0" align="center" color="#000" width="2"></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
